# badge: https://github.com/bepasty/bepasty-server/workflows/CI/badge.svg?branch=master

name: CI

on:
  push:
    branches: [ master ]
    paths:
    - '**.py'
    - '**.yml'
    - '**.toml'
    - '**.cfg'
    - '**.ini'
    - 'requirements.d/*'
    - 'docker/**'
    - '**/Dockerfile'
    - '!docs/**'
  pull_request:
    branches: [ master ]
    paths:
    - '**.py'
    - '**.yml'
    - '**.toml'
    - '**.cfg'
    - '**.ini'
    - 'requirements.d/*'
    - 'docker/**'
    - '**/Dockerfile'
    - '!docs/**'

jobs:
  lint:

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Lint with flake8
      run: |
        pip install flake8-pyproject flake8
        flake8 src scripts

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - name: Lint Dockerfile with Hadolint
      uses: hadolint/hadolint-action@v3.4.0
      with:
        dockerfile: docker/Dockerfile
        failure-threshold: warning

  docker-image-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t bepasty-ci:${{ github.sha }} .
    - name: Smoke test Python package in image
      run: |
        docker run --rm bepasty-ci:${{ github.sha }} /app/env/bin/python -c "import bepasty.app; print('bepasty import ok')"
    - name: Container HTTP smoke test
      run: |
        set -euo pipefail
        cid=$(docker run -d \
          -e BEPASTY_SITENAME="CI Test Instance" \
          -e BEPASTY_SECRET_KEY="ci-test-secret-key-change-me" \
          -p 8000:8000 \
          bepasty-ci:${{ github.sha }})
        trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "Container did not become ready on :8000 in time"
        exit 1

  pytest:

    needs: lint

    strategy:
      matrix:
        include:
            - os: ubuntu-24.04
              python-version: '3.11'
              toxenv: py311
            - os: ubuntu-24.04
              python-version: '3.12'
              toxenv: py312
            - os: ubuntu-24.04
              python-version: '3.13'
              toxenv: py313
            - os: ubuntu-24.04
              python-version: '3.14'
              toxenv: py314
            - os: ubuntu-24.04
              python-version: '3.15'
              toxenv: py315

    env:
      TOXENV: ${{ matrix.toxenv }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        # Fetching only the latest commit is not enough for setuptools-scm; fetch full history
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.d/dev.txt
    - name: Run pytest via tox
      run: |
        tox --skip-missing-interpreters
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      env:
        OS: ${{ runner.os }}
        python: ${{ matrix.python-version }}
      with:
        env_vars: OS, python
