# Release automation: build the source distribution, attest its provenance,
# create a GitHub release with it and publish it to PyPI.
#
# This runs when a release tag is pushed. There are no wheels: only the sdist
# has ever been published.
#
# The GitHub release is created as a *draft* on purpose: the release notes want
# a human. Publishing the draft is a single click in the GitHub UI.
#
# The sdist has a build provenance attestation, and the sigstore bundle of that
# attestation is attached to the release as <sdist>.sigstore.jsonl, for offline
# verification.
#
# The upload to PyPI is a separate job only so that the "pypi" environment gate
# applies to the upload alone - that is the last chance to stop a release before
# the irreversible step.
#
# One-time setup, so that no API token has to be stored anywhere:
#  - on pypi.org, add a trusted publisher to the "bepasty" project:
#    owner "bepasty", repository "bepasty-server", workflow "release.yml",
#    environment "pypi".
#  - create the "pypi" environment in the repository settings. Configuring
#    required reviewers for it makes the upload wait for an approval.

name: Release

on:
  push:
    # bepasty tags have no "v" prefix (any more): 1.2.2, and 1.3.0b1 for a
    # pre-release.
    tags:
    - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  github_release:
    name: Build the sdist and draft the GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: write      # to create the release
      id-token: write      # to attest the sdist
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Just fetching one commit is not enough for setuptools-scm, so we fetch all.
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'

    - name: Build the sdist
      run: |
        set -euxo pipefail
        python -m pip install --upgrade pip build twine packaging
        python -m build --sdist
        twine check dist/*
        ls -l dist/

    - name: Check that the sdist has the version of the tag
      # If the checkout is modified or the tag was not fetched, setuptools-scm
      # does not use the tag as the version, but silently guesses the next one
      # and appends .devN. Such a release must not be uploaded to PyPI.
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euxo pipefail
        python - "$TAG" dist/bepasty-*.tar.gz <<'EOF'
        import sys
        from packaging.utils import parse_sdist_filename
        from packaging.version import Version
        tag, sdist = sys.argv[1], sys.argv[2]
        _, version = parse_sdist_filename(sdist.rpartition("/")[2])
        if version != Version(tag):
            raise SystemExit(f"sdist version {version} is not the tag version {tag} - modified checkout?")
        print(f"sdist version {version} is the tag version.")
        EOF

    - name: Check that the sdist is complete and installable
      # A release that cannot be installed from PyPI is the worst kind of
      # release, and nothing else in CI ever installs bepasty from a sdist.
      # The tests are part of the package, so run them against what the sdist
      # installed (from outside the checkout, so that src/ is not imported).
      # The tests that need a running server and a browser are skipped, like
      # in ci.yml.
      run: |
        set -euxo pipefail
        python -m venv "$RUNNER_TEMP/venv-sdist"
        "$RUNNER_TEMP/venv-sdist/bin/pip" install --upgrade pip
        "$RUNNER_TEMP/venv-sdist/bin/pip" install dist/bepasty-*.tar.gz
        "$RUNNER_TEMP/venv-sdist/bin/pip" install pytest selenium requests
        "$RUNNER_TEMP/venv-sdist/bin/bepasty-server" --help > /dev/null
        "$RUNNER_TEMP/venv-sdist/bin/bepasty-object" --help > /dev/null
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/venv-sdist/bin/pytest" -p no:cacheprovider -rs -m "not needs_server" --pyargs bepasty.tests

    - name: Attest the sdist provenance
      id: attest-sdist
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-path: 'dist/*.tar.gz'

    - name: Name the sigstore bundle after the sdist
      # The attestation is also stored in the GitHub attestations API, but
      # fetching it from there needs a recent gh and a GitHub token - so attach
      # the sigstore bundle to the release as <sdist>.sigstore.jsonl, which
      # allows offline/token-less verification with generic sigstore tooling
      # (cosign, gh attestation verify --bundle).
      env:
        BUNDLE_PATH: ${{ steps.attest-sdist.outputs.bundle-path }}
      run: |
        set -euxo pipefail
        sdist=$(basename dist/bepasty-*.tar.gz)
        cp "$BUNDLE_PATH" "dist/$sdist.sigstore.jsonl"

    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euxo pipefail
        # 1.3.0b1 and friends are pre-releases, 1.3.0 is not.
        prerelease=""
        case "$TAG" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
        cat > release-notes.md <<EOF
        See the [changelog](https://github.com/bepasty/bepasty-server/blob/$TAG/CHANGES.rst) for what changed in this release.

        ### Installation

        \`pip install bepasty==$TAG\`

        ### Verification

        The sdist has a [build provenance attestation](https://github.com/bepasty/bepasty-server/attestations),
        verifiable with \`gh attestation verify --owner bepasty bepasty-$TAG.tar.gz\`.

        The attestation is additionally attached as a [sigstore](https://www.sigstore.dev/)
        bundle \`bepasty-$TAG.tar.gz.sigstore.jsonl\`, so it can be verified offline and
        without a GitHub token, e.g. with cosign:

        \`\`\`
        cosign verify-blob bepasty-$TAG.tar.gz \\
          --bundle bepasty-$TAG.tar.gz.sigstore.jsonl \\
          --certificate-identity https://github.com/bepasty/bepasty-server/.github/workflows/release.yml@refs/tags/$TAG \\
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
        \`\`\`
        EOF
        if gh release view "$TAG" > /dev/null 2>&1; then
          # a re-run of this job: keep the (possibly already edited) release and
          # just replace its assets.
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.sigstore.jsonl
        else
          gh release create "$TAG" \
            --draft $prerelease \
            --verify-tag \
            --title "bepasty $TAG" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/*.sigstore.jsonl
        fi
        gh release view "$TAG" --json isDraft,isPrerelease,assets

    - name: Keep the sdist for the PyPI upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  pypi:
    name: Upload the sdist to PyPI
    needs: [github_release]

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: pypi
      url: https://pypi.org/project/bepasty/${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write  # trusted publishing

    steps:
    - name: Get the sdist built by the release job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: sdist
        path: dist

    - name: What we are about to upload
      run: ls -l dist/

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
